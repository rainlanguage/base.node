# Load API key map
map $api_key $valid_key {
    include /etc/nginx/api_keys.map;
    default 0;    # deny by default
}

# RPC JSON Log Format (single-line for Fluent Bit parsing)
log_format rpc_json escape=json '{"time": "$time_iso8601","connection_type": "$connection_type","remote_addr": "$remote_addr","xff": "$proxy_add_x_forwarded_for","method": "$request_method","uri": "$request_uri","status": $status,"request_time": $request_time,"upstream_time": "$upstream_response_time","request_length": $request_length,"bytes_sent": $bytes_sent,"api_key": "$api_key","host": "$host"}';

# RPC http Server
server {
    listen 18545;
    server_name _;

    access_log /var/log/nginx/rpc.log rpc_json;

    set $connection_type "http";
    set $api_key "";

    # Optional hardening
    # client_max_body_size 5m;

    # Extract apikey from first path segment of the URL: /<apikey>/...
    location ~ ^/([^/]+)(?:/(.*))?$ {

        set $api_key $1;
        set $rest $2;

        # Require apikey query param
        if ($valid_key = 0) {
            return 403 '{"error":"forbidden","reason":"permission denied, invalid api key"}';
        }


        proxy_pass http://127.0.0.1:8545/$rest;

        # proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # important for accurate latency measurement
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# RPC ws Server
server {
    listen 18546;
    server_name _;

    access_log /var/log/nginx/rpc.log rpc_json;

    set $connection_type "ws";
    set $api_key "";

    # Extract apikey from first path segment of the URL: /<apikey>/...
    location ~ ^/([^/]+)(?:/(.*))?$ {

        set $api_key $1;
        set $rest $2;

        # Require apikey query param
        if ($valid_key = 0) {
            return 403 '{"error":"forbidden","reason":"permission denied, invalid api key"}';
        }

        proxy_pass http://127.0.0.1:8546/$rest;
        proxy_http_version 1.1;   # REQUIRED for WebSocket

        # proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If you ever use websockets on this port:
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # read/send timeouts
        # proxy_read_timeout 3600s;
        # proxy_send_timeout 3600s;
   
        # important for accurate latency measurement
        proxy_buffering off;
    } 
}

# RPC https server (TLS via Let's Encrypt, base-rpc.rainlang.xyz).
# Same api-key-in-path auth ($valid_key map defined above), proxied to local reth.
server {
    listen 443 ssl;
    server_name base-rpc.rainlang.xyz;

    ssl_certificate     /etc/letsencrypt/live/base-rpc.rainlang.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/base-rpc.rainlang.xyz/privkey.pem;

    access_log /var/log/nginx/rpc.log rpc_json;
    set $connection_type "https";
    set $api_key "";

    location ~ ^/([^/]+)(?:/(.*))?$ {
        set $api_key $1;
        set $rest $2;

        if ($valid_key = 0) {
            return 403 '{"error":"forbidden","reason":"permission denied, invalid api key"}';
        }

        proxy_pass http://127.0.0.1:8545/$rest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
